server:
  port: 8080

spring:
  application:
    name: mailchimp-marketing

mailchimp:
  api:
    key: ${MAILCHIMP_API_KEY:your-api-key-here}
    server-prefix: ${MAILCHIMP_SERVER_PREFIX:us1}   # e.g. us1, us2, us14
    base-url: https://${mailchimp.api.server-prefix}.api.mailchimp.com/3.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mailchimp: DEBUG
    org.springframework.web: INFO
